<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none" role="img" aria-label="BranchWise">
  <!--
    The macOS variant. Apple's icon grid leaves the artwork at 824x824 inside a 1024
    canvas, so the icon sits at the same visual size as every other app in the Dock;
    the full-bleed branchwise-icon.svg is the right shape for Windows and Linux, which
    expect the artwork to reach the edges.
  -->
  <defs>
    <linearGradient id="bw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bw)" filter="url(#sh)"/>
  <g transform="translate(215.5 215.5) scale(9.27)">
    <path d="M32 50V31M32 31L18 17M32 31L46 17M32 31L46 45" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18" cy="17" r="5.5" fill="#ffffff"/>
    <circle cx="46" cy="17" r="5.5" fill="#ffffff"/>
    <circle cx="46" cy="45" r="5.5" fill="#ffffff"/>
    <circle cx="32" cy="50" r="5.5" fill="#ffffff"/>
    <circle cx="32" cy="31" r="4.5" fill="#ffffff"/>
  </g>
</svg>
