[project]
name = "branchwise-backend"
version = "0.1.0"
description = "branchwise-app2 FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "pyjwt[crypto]>=2.9",
  "python-dotenv>=1.0",
  "psycopg2-binary>=2.9",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "python-multipart>=0.0.9",
  "pyidaungsu>=0.1.4",
  "langgraph>=0.2.60",
  "langchain-openai>=0.2.14",
  "boto3>=1.34",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "pyinstaller>=6.10"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
